# screen tuning
#無操作で暗く
CONFIG_ROBA_DIM_AFTER_MS=180000
#明るい時の輝度
CONFIG_ROBA_CONTRAST_BRIGHT=0xCF
#暗いとき用
CONFIG_ROBA_CONTRAST_DIM=0x05

# refresh tuning  : いらないかも
CONFIG_ROBA_PERIOD_IDLE_MS=1000
CONFIG_ROBA_PERIOD_ACTIVE_MS=200
CONFIG_ROBA_ACTIVE_HOLD_MS=3000

# animation
CONFIG_ROBA_ANIM_PERIOD_MS=1000

